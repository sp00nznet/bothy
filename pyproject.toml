[project]
name = "bothy"
version = "0.1.0"
description = "Multi-provider infrastructure deployment console"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["flask>=3.0"]

[project.scripts]
bothy = "bothy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
